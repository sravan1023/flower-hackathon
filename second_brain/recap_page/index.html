<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain recap</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:24px;background:#0f1216;color:#e6e8eb}
h1{margin:0 0 4px;font-size:22px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:#8a94a3;margin:28px 0 8px}
.sub{color:#8a94a3}.row{display:flex;align-items:center;gap:10px;margin:4px 0}.lbl{flex:0 0 40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;background:#1c222b;height:12px;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#4c9aff}
table{border-collapse:collapse}td,th{padding:4px 8px;font-size:13px;border:1px solid #1c222b}
li{margin:3px 0}.empty{color:#5d6675}code{color:#9fb3c8;font-size:12px}
</style></head><body>
<h1 id="goal">No goal yet</h1><div class="sub" id="meta"></div>
<h2>Decisions</h2><ul id="decisions"></ul>
<h2>Event scores</h2><div id="events"></div>
<h2>Photo x community</h2><div id="heat"></div>
<h2>Action log</h2><ul id="actions"></ul>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function empty(t){return '<span class="empty">'+t+'</span>'}
function render(d){
  $("goal").textContent=d.goal||"No goal yet";
  const a=d.alignment_before!=null&&d.alignment_after!=null?" | alignment "+(+d.alignment_before).toFixed(2)+" -> "+(+d.alignment_after).toFixed(2):"";
  $("meta").textContent=(d.scorer?"scorer: "+d.scorer:"")+a+" | log entries: "+(d.log_count||0);
  $("decisions").innerHTML=(d.decisions||[]).map(x=>"<li>"+esc(x.id)+". "+esc(x.title)+" <code>"+esc(x.status)+"</code></li>").join("")||"<li>"+empty("no decisions yet")+"</li>";
  $("events").innerHTML=(d.events||[]).map(e=>{const p=Math.max(0,Math.min(1,+e.score||0))*100;
    return '<div class="row"><span class="lbl">'+esc(e.title)+'</span><span class="bar"><i style="width:'+p+'%"></i></span><span>'+(+e.score||0).toFixed(2)+"</span></div>"}).join("")||empty("no events scored yet");
  const h=d.heatmap||{},rows=h.rows||[],cols=h.cols||[],v=h.values||[];
  $("heat").innerHTML=rows.length&&cols.length?"<table><tr><th></th>"+cols.map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr>"+rows.map((r,i)=>"<tr><th>"+esc(r)+"</th>"+cols.map((c,j)=>{const x=+((v[i]||[])[j])||0;return '<td style="background:rgba(76,154,255,'+Math.max(0,Math.min(1,x)).toFixed(2)+')">'+x.toFixed(2)+"</td>"}).join("")+"</tr>").join("")+"</table>":empty("no photo scores yet");
  $("actions").innerHTML=(d.actions||[]).map(x=>"<li><code>"+esc(new Date((x.ts||0)*1000).toLocaleTimeString())+"</code> "+esc(x.task)+" "+esc(JSON.stringify(x.argv||x.out||x.error||"").slice(0,120))+"</li>").join("")||"<li>"+empty("no actions yet")+"</li>";
}
async function tick(){try{const r=await fetch("data.json"===0?"":"/recap/data.json",{cache:"no-store"});render(await r.json())}catch(e){render({})}}
tick();setInterval(tick,3000);
</script></body></html>
