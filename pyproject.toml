[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "0.1.3"
description = "Goal-driven Second Brain: turns a goal into milestones, ranks options with embeddings, and issues decision cards you approve."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
  "flwr>=1.38.0,<2.0",
  "openai>=2.16.0,<3.0.0",
  "anthropic>=0.40.0",
  "numpy>=1.26",
  "model2vec>=0.3.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "open_clip_torch>=2.24", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["second_brain"]

[tool.flwr.app]
publisher = "lokilks"
display-name = "Second Brain"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["second_brain/**/*.py", "second_brain/config/*.yaml", "second_brain/seed/*.json", "LICENSE", "README.md"]

[tool.flwr.app.components]
agentapp = "second_brain.agent_app:app"

[tool.flwr.app.config]
"agent.model" = "openai/gpt-5.6-sol"
"agent.input" = "My goal: land an AI security role by December"
